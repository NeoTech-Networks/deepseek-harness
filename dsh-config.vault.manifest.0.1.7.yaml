# DSH Config Vault allowlist, 0.1.7 layout.
#
# finish-install.ps1 copies this over C:\Projects\repos\dsh-config\vault.manifest.yaml
# once the one-time 0.1.5 -> 0.1.7 settings migration is proven, then snapshots.
#
# What moved on 0.1.7 and why this list differs from the 0.1.5 one:
#   * settings.yaml is imported once on first boot and renamed to
#     settings.yaml.imported. The live settings now sit in the PROFILE PATCH,
#     profiles/desktop/cordis.patch.yml, which the Settings screen edits.
#     Protecting settings.yaml would report it MISSING forever, and a restore
#     would re-import it on every boot.
#   * .agent-presets is no longer read. The hook bridge and MCP rows it held are
#     root rows in the home patch, cordis.patch.yml, which the desktop app now
#     reads and hot-reloads.
#   * profiles/** is no longer denied wholesale: the include list below names the
#     one file under it that matters, and nothing else under profiles is included.
#
# Paths are relative to DSH_HOME. Matching and "deny always wins" rules are the
# same as before (see the 0.1.5 manifest history in git).

version: 1

include:
  - cordis.patch.yml
  - profiles/desktop/cordis.patch.yml
  - settings.yaml.imported
  - AGENTS.md
  - skills/*.md
  # GENERATED by C:\Claude\bin\dsh_dashboard_links.py; a restore can put a stale
  # map back over a newer regeneration. Re-run the generator; it is not corruption.
  - dashboard-links.json
  - design-links.json

deny:
  # Secrets. These live in Keeper and must never enter this repo.
  - .credentials.yaml
  - "*credential*"
  - "*.key"
  - "*.pem"
  - .env
  # Stale leftovers and machine identity.
  - settings.yaml.bak
  - "*.bak"
  - "*.pre-0.1.7"
  - .anonymous-user-id
  # Regenerated or cache directories. Never snapshotted, never restored.
  - profiles/desktop.0.1.5-runtime/**
  - profiles/*/node_modules/**
  - sessions/**
  - storages/**
  - attachments/**
  - desktop/**
  - dsh-runtimes/**
  - llm-deepseek/**
  - migration-0.1.7/**
